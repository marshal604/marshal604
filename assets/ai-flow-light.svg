<text x="622.0" y="36" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">Draft PR</text>
<text x="622.0" y="55" text-anchor="middle" font-size="12" fill="#59636e">AI review + Slack ping</text>
<line x1="700" y1="40.0" x2="726" y2="40.0" stroke="#8c959f" stroke-width="1.5" marker-end="url(#a)"/>
<text x="622.0" y="96" text-anchor="middle" font-size="12" font-weight="600" fill="#0969da">~100 s from broken main</text>
