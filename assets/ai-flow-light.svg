<svg xmlns="http://www.w3.org/2000/svg" width="880" height="104" viewBox="0 0 880 104" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8c959f"/></marker></defs>
<rect x="1" y="8" width="150" height="64" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
<text x="76.0" y="36" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">Something breaks</text>
<text x="76.0" y="55" text-anchor="middle" font-size="12" fill="#59636e">CI, alert or bug report</text>
<line x1="154" y1="40.0" x2="180" y2="40.0" stroke="#8c959f" stroke-width="1.5" marker-end="url(#a)"/>
