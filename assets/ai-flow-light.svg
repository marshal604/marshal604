<line x1="336" y1="40.0" x2="362" y2="40.0" stroke="#8c959f" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="365" y="8" width="150" height="64" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
<text x="440.0" y="36" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">Workflow verifies</text>
<text x="440.0" y="55" text-anchor="middle" font-size="12" fill="#59636e">tests fail, then pass</text>
<line x1="518" y1="40.0" x2="544" y2="40.0" stroke="#8c959f" stroke-width="1.5" marker-end="url(#a)"/>
