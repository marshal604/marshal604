<svg xmlns="http://www.w3.org/2000/svg" width="880" height="104" viewBox="0 0 880 104" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#656c76"/></marker></defs>
<rect x="1" y="8" width="150" height="64" rx="8" fill="#151b23" stroke="#3d444d"/>
<text x="76.0" y="36" text-anchor="middle" font-size="14" font-weight="600" fill="#f0f6fc">Something breaks</text>
<text x="76.0" y="55" text-anchor="middle" font-size="12" fill="#9198a1">CI, alert or bug report</text>
<line x1="154" y1="40.0" x2="180" y2="40.0" stroke="#656c76" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="183" y="8" width="150" height="64" rx="8" fill="#0d2a4d" stroke="#4493f8"/>
<text x="258.0" y="36" text-anchor="middle" font-size="14" font-weight="600" fill="#f0f6fc">Claude fixes it</text>
<text x="258.0" y="55" text-anchor="middle" font-size="12" fill="#9198a1">with read-only access</text>
<line x1="336" y1="40.0" x2="362" y2="40.0" stroke="#656c76" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="365" y="8" width="150" height="64" rx="8" fill="#151b23" stroke="#3d444d"/>
<text x="440.0" y="36" text-anchor="middle" font-size="14" font-weight="600" fill="#f0f6fc">Workflow verifies</text>
<text x="440.0" y="55" text-anchor="middle" font-size="12" fill="#9198a1">tests fail, then pass</text>
<line x1="518" y1="40.0" x2="544" y2="40.0" stroke="#656c76" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="547" y="8" width="150" height="64" rx="8" fill="#151b23" stroke="#3d444d"/>
<text x="622.0" y="36" text-anchor="middle" font-size="14" font-weight="600" fill="#f0f6fc">Draft PR</text>
<text x="622.0" y="55" text-anchor="middle" font-size="12" fill="#9198a1">AI review + Slack ping</text>
<line x1="700" y1="40.0" x2="726" y2="40.0" stroke="#656c76" stroke-width="1.5" marker-end="url(#a)"/>
<text x="622.0" y="96" text-anchor="middle" font-size="12" font-weight="600" fill="#4493f8">~100 s from broken main</text>
<rect x="729" y="8" width="150" height="64" rx="8" fill="#151b23" stroke="#3d444d"/>
<text x="804.0" y="36" text-anchor="middle" font-size="14" font-weight="600" fill="#f0f6fc">Human approves</text>
